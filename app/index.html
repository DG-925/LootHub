<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<meta name="description" content="Free games, deals, DLC, Twitch drops and subscription prices across every PC store.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; connect-src 'self' https://www.gamerpower.com https://www.cheapshark.com https://store-site-backend-static.ak.epicgames.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>LootHub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="top">
      <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search" placeholder="Search games, drops, deals, DLC…" autocomplete="off"></label>
      <div style="flex:1"></div>
      <div class="statusline" id="status"></div>
      <a class="iconbtn" href="#alerts" title="Alerts"><i class="fa-regular fa-bell"></i><span class="dot" id="belldot" hidden></span></a>
      <button class="iconbtn" data-action="refresh" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
    </div>
    <div class="mobile-top">
      <div class="logo"><div class="mark"><i class="fa-solid fa-gift"></i></div><span>Loot<b>Hub</b></span></div>
      <div class="row" style="gap:8px">
        <button class="iconbtn" data-action="msearch" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        <a class="iconbtn" href="#alerts" title="Alerts"><i class="fa-regular fa-bell"></i><span class="dot" id="belldot2" hidden></span></a>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
